
<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: Arial;
            text-align: center;
        }

        .login {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #ddd;
        }

        h1 {
            font-family: cursive;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 5px;
        }

        button {
            width: 98%;
            padding: 10px;
            background: #3897f0;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login">
    <h1>Instagram</h1>

    <input type="text" placeholder="Username">

    <input type="password" placeholder="Password">

    <button>Log In</button>

    <p>Forgot password?</p>
    <p>Don't have an account? Sign up</p>
</div>

</body>
</html>
