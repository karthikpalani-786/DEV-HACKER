
<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>

    <style>
        body {
            background: linear-gradient(45deg, purple, red, orange);
            font-family: Arial;
            text-align: center;
        }

        .login {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            font-family: cursive;
            font-size: 35px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e1306c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Instagram</h1>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button>Log In</button>

        <p>Forgot Password?</p>

        <p>Don't have an account? Sign up</p>

    </div>

</body>
</html>
