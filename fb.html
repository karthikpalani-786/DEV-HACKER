
<!DOCTYPE html>
<html>
<head>
    <title>Facebook</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f0f2f5;
        }

        header {
            background: #1877f2;
            color: white;
            padding: 15px;
            font-size: 30px;
            font-weight: bold;
        }

        .container {
            width: 400px;
            background: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

<header>facebook</header>

<div class="container">

    <h2>Welcome to Facebook</h2>

    <input type="text" placeholder="Your Name">

    <input type="email" placeholder="Email Address">

    <input type="password" placeholder="Password">

    <button>Sign Up</button>

    <p>Connect with friends and family!</p>

</div>

</body>
</html>
